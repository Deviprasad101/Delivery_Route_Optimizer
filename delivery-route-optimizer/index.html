<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>delivery-route-optimizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "on-error": "#ffffff",
              "on-secondary-fixed": "#0b1c30",
              "on-tertiary-fixed": "#360f00",
              "secondary-container": "#d0e1fb",
              "tertiary-fixed": "#ffdbcd",
              "on-tertiary-container": "#ffc0a7",
              "secondary": "#505f76",
              "surface-dim": "#d8dadc",
              "primary-container": "#0f52ba",
              "inverse-on-surface": "#eff1f3",
              "on-primary-fixed-variant": "#00419c",
              "surface-container-lowest": "#ffffff",
              "on-secondary-fixed-variant": "#38485d",
              "surface-tint": "#1d59c1",
              "on-tertiary": "#ffffff",
              "secondary-fixed-dim": "#b7c8e1",
              "surface-variant": "#e0e3e5",
              "outline": "#737784",
              "outline-variant": "#c3c6d5",
              "primary": "#003c90",
              "on-surface-variant": "#434653",
              "on-primary-container": "#bcceff",
              "error": "#ba1a1a",
              "on-tertiary-fixed-variant": "#7d2d00",
              "tertiary-fixed-dim": "#ffb596",
              "surface": "#f7f9fb",
              "inverse-surface": "#2d3133",
              "background": "#f3f4f6", /* updated to slightly darker for better contrast */
              "on-primary": "#ffffff",
              "on-secondary": "#ffffff",
              "on-error-container": "#93000a",
              "on-primary-fixed": "#001945",
              "tertiary": "#732900",
              "error-container": "#ffdad6",
              "primary-fixed": "#d9e2ff",
              "on-background": "#191c1e",
              "surface-container-high": "#e6e8ea",
              "surface-container-low": "#f2f4f6",
              "secondary-fixed": "#d3e4fe",
              "inverse-primary": "#b0c6ff",
              "surface-bright": "#f7f9fb",
              "surface-container-highest": "#e0e3e5",
              "surface-container": "#ffffff", /* updated */
              "primary-fixed-dim": "#b0c6ff",
              "tertiary-container": "#993900",
              "on-secondary-container": "#54647a",
              "on-surface": "#191c1e"
            },
            "borderRadius": {
              "DEFAULT": "0.125rem",
              "lg": "0.5rem", /* updated */
              "xl": "0.75rem", /* updated */
              "full": "9999px" /* updated */
            },
            "spacing": {
              "gutter": "24px", /* updated */
              "base": "4px",
              "margin-page": "32px",
              "lg": "24px",
              "xl": "32px",
              "sm": "12px",
              "md": "16px",
              "xs": "8px",
              "xxs": "4px" /* added */
            },
            "fontFamily": {
              "mono-metric": ["JetBrains Mono"],
              "label-caps": ["Inter"],
              "headline-sm": ["Hanken Grotesk"],
              "data-table": ["Inter"],
              "headline-md": ["Hanken Grotesk"],
              "display-lg": ["Hanken Grotesk"],
              "body-lg": ["Inter"],
              "body-md": ["Inter"]
            },
            "fontSize": {
              "mono-metric": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
              "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
              "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
              "data-table": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
              "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
              "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
              "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
              "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
